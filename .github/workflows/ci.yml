name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pothos_test
          POSTGRES_USER: pothos_test
          POSTGRES_PASSWORD: pothos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pothos_test -d pothos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POTHOS_PG_URL: postgresql://pothos_test:pothos_test@localhost:5432/pothos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit

# Pothos · 生产部署（引擎 + PostgreSQL 16 + Caddy 自动 TLS）
#
# 用法：
#   cp deploy/.env.example deploy/.env   # 填三个值：POSTGRES_PASSWORD / POTHOS_TOKEN / DOMAIN(+ACME_EMAIL)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 只想内网用（手机同 WiFi，不上公网）：注释掉 caddy 服务，把 engine 端口映射改为 "7788:7788"。
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pothos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: pothos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pothos -d pothos"]
      interval: 5s
      timeout: 3s
      retries: 12

  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POTHOS_PG_URL: postgresql://pothos:${POSTGRES_PASSWORD}@db:5432/pothos
      POTHOS_TOKEN: ${POTHOS_TOKEN:?请在 deploy/.env 设置 POTHOS_TOKEN（公网暴露必设）}
      POTHOS_RECONCILE: "1"
    ports:
      # 只绑本机回环：公网入口走 caddy（TLS + 域名）。内网直连场景改成 "7788:7788"。
      - "127.0.0.1:7788:7788"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - engine
    environment:
      DOMAIN: ${DOMAIN:?请在 deploy/.env 设置 DOMAIN（公网部署）；内网部署可注释整个 caddy 服务}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
